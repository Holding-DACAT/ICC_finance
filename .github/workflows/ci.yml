name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build (sans base de données)
        run: pnpm exec next build
        env:
          # Build statique/dynamique sans BDD : les pages dynamiques ne sont pas pré-rendues.
          USE_INTEGRATION_MOCKS: "true"
          AUTH_SECRET: "ci-dummy-secret-not-used-at-runtime"
